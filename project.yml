name: MomentumDeviceSwitcher
options:
  bundleIdPrefix: com.zhengyangliu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ENABLE_MODULES: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  MomentumCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/MomentumCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhengyangliu.MomentumCore
        PRODUCT_NAME: MomentumCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
  MomentumBluetooth:
    type: framework
    platform: macOS
    sources:
      - path: Sources/MomentumBluetooth
    dependencies:
      - target: MomentumCore
      - sdk: IOBluetooth.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhengyangliu.MomentumBluetooth
        PRODUCT_NAME: MomentumBluetooth
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
  MomentumDeviceSwitcher:
    type: application
    platform: macOS
    sources:
      - path: NativeApp
    dependencies:
      - target: MomentumCore
        embed: true
      - target: MomentumBluetooth
        embed: true
      - target: MomentumDeviceWidget
        embed: true
      - package: Sparkle
        product: Sparkle
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhengyangliu.MomentumDeviceSwitcher
        PRODUCT_NAME: M4 Companion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: NativeApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: NativeApp/MomentumDeviceSwitcher.entitlements
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  MomentumDeviceWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: WidgetExtension/MomentumWidget.swift
    dependencies:
      - target: MomentumCore
      - target: MomentumBluetooth
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - sdk: IOBluetooth.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhengyangliu.MomentumDeviceSwitcher.Widget
        PRODUCT_NAME: MomentumDeviceWidget
        INFOPLIST_FILE: WidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/MomentumDeviceWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
schemes:
  MomentumDeviceSwitcher:
    build:
      targets:
        MomentumDeviceSwitcher: all
        MomentumDeviceWidget: all
    run:
      config: Debug
    archive:
      config: Release
